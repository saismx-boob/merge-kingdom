<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lumo : Les Routes de l'Or</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="bg-layer"></div>

<header id="hud">
  <div class="hud-left">
    <div id="coin-box" class="pill">🪙 <span id="coin-count">0</span></div>
    <div id="energy-box" class="pill">
      ⚡ <span id="energy-count">0</span>
      <span id="energy-bar"><i id="energy-fill"></i></span>
      <button id="buy-energy-btn">+5</button>
    </div>
    <div id="level-box" class="pill">
      ⭐ <span id="level-num">1</span>
      <span id="xp-bar"><i id="xp-fill"></i></span>
    </div>
  </div>
  <nav class="hud-right">
    <button id="nav-merge" class="nav-btn active">🏰</button>
    <button id="nav-map" class="nav-btn">🗺️</button>
    <button id="nav-battle" class="nav-btn">⚔️</button>
    <button id="lang-toggle" class="nav-btn">🌐 <span id="lang-label">FR</span></button>
    <button id="story-btn" class="nav-btn">📖</button>
  </nav>
</header>

<section id="screen-merge" class="screen active">
  <div id="orders-bar">
    <h3 id="orders-title"></h3>
    <div id="orders-cards"></div>
  </div>
  <div id="board-wrap"><div id="board"></div></div>
  <footer>
    <div id="gen-row"></div>
    <p id="hint"></p>
  </footer>
</section>

<section id="screen-map" class="screen">
  <div id="map-head">
    <h3 id="map-title"></h3>
    <span id="map-progress"></span>
  </div>
  <div id="map-list"></div>
</section>

<section id="screen-battle" class="screen">
  <div id="battle-info">
    <span id="wave-label"></span>
    <span id="reward-label"></span>
  </div>
  <div id="arena">
    <div id="enemy-side" class="side"></div>
    <div id="vs">⚔️</div>
    <div id="player-side" class="side"></div>
  </div>
  <div id="battle-log"></div>
  <footer><button id="fight-btn"></button></footer>
</section>

<div id="toast"></div>

<div id="story-modal" class="modal hidden">
  <div class="modal-card">
    <h2 id="story-title"></h2>
    <div id="story-text"></div>
    <button id="story-close" class="nav-btn"></button>
  </div>
</div>

<script src="data.js"></script>
<script src="lang.js"></script>
<script src="game.js"></script>
<script src="map.js"></script>
<script src="battle.js"></script>
</body>
</html>
