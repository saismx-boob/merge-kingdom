<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Merge Kingdom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Barre du haut -->
  <header id="hud">
    <div id="coins">🪙 <span id="coin-count">50</span></div>
    <nav>
      <button class="nav-btn active" id="nav-merge">🏰 Royaume</button>
      <button class="nav-btn" id="nav-battle">⚔️ Combat</button>
    </nav>
  </header>

  <!-- ÉCRAN ROYAUME (merge) -->
  <section id="screen-merge" class="screen active">
    <main id="board"></main>
    <footer>
      <button id="spawn-btn">✨ Invoquer (10 🪙)</button>
      <p id="hint">⛏️ Mine : +2 🪙 / 15s &nbsp;•&nbsp; Fusionne 2 créatures identiques !</p>
    </footer>
  </section>

  <!-- ÉCRAN COMBAT -->
  <section id="screen-battle" class="screen">
    <div id="battle-info">
      <span id="wave-label">Vague 1</span>
      <span id="reward-label">Récompense : 15 🪙</span>
    </div>
    <div id="arena">
      <div id="enemy-side" class="side"></div>
      <div id="vs">⚔️</div>
      <div id="player-side" class="side"></div>
    </div>
    <div id="battle-log"></div>
    <footer>
      <button id="fight-btn">⚔️ LANCER LE COMBAT</button>
    </footer>
  </section>

  <script src="game.js"></script>
  <script src="battle.js"></script>
</body>
</html>
